<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SONI FAST FOOD | Owner</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#202124;background:#f6f7fa}*{box-sizing:border-box}body{margin:0}header{background:#202124;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0}main{max-width:1120px;margin:auto;padding:18px}.panel,.order{background:white;border:1px solid #e4e6ec;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 9px #00000008}input,select,button{font:inherit;padding:11px;border:1px solid #d5d8df;border-radius:9px}input{max-width:100%}button{background:#f8bf31;color:#171717;font-weight:650;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.muted{color:#626773}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.grow{flex:1}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{background:#f7f7f7;padding:14px;border-radius:10px}.stat b{font-size:24px;display:block}.order h3{margin:0 0 8px}.order p{margin:6px 0;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.actions button{font-size:13px;padding:9px}.danger{background:#ffe1df}.ok{color:#137c45}.error{color:#ad2d2d}.pill{display:inline-block;border-radius:20px;background:#eee;padding:5px 10px;font-size:12px}.report{white-space:pre-wrap}a{color:#005cbf}#login{max-width:430px;margin:50px auto}#password{width:100%}
@media(max-width:640px){main{padding:10px}.panel,.order{padding:13px}.actions button{flex:1 1 45%;min-height:45px}header{padding:12px}header h1{font-size:16px}.row button{min-height:42px}}
</style></head><body>
<header><h1>🍔 SONI FAST FOOD <small>Owner Dashboard</small></h1><button id="logout" class="hidden">Logout</button></header>
<main>
<section id="login" class="panel"><h2>Secure Owner Login</h2><p class="muted">Use the password initialized in Google Apps Script.</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Owner password" required minlength="16"><p><button type="submit">Sign In</button></p></form><p id="loginMsg" role="status"></p></section>
<section id="dashboard" class="hidden"><div class="row"><button id="refresh">↻ Refresh Orders</button><button id="notifyBtn" type="button">🔔 Enable sound alerts</button><span id="newOrderCount" class="pill">0 new</span><select id="filter"><option value="ALL">All Orders</option><option>PLACED</option><option>ACCEPTED</option><option>PREPARING</option><option>OUT_FOR_DELIVERY</option><option>DELIVERED</option><option>REJECTED</option></select><span id="message" role="status" class="muted"></span></div>
<section class="panel"><h2>Sales Summary</h2><div class="row"><label>From <input id="from" type="date"></label><label>To <input id="to" type="date"></label><button id="reportBtn">Load Report</button><button id="todayBtn" type="button">Today</button><button id="yesterdayBtn" type="button">Yesterday</button><button id="weekBtn" type="button">7 Days</button><button id="monthBtn" type="button">This Month</button><button id="exportBtn" type="button">Export CSV</button></div><div id="stats" class="stats" style="margin-top:12px"></div><p class="muted">Realized sales = delivered orders marked PAID. Payment verification is manual.</p></section>
<h2>Delivery Orders</h2><div id="orders"></div></section>
</main><script src="config.js"></script><script src="admin.js?v=32"></script></body></html>
